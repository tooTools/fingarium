
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animated Comic | Fingarium</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .reader {
            max-width: 1000px;
            margin: 30px auto;
        }

        #episodeTitle {
            margin-bottom: 20px;
        }

        /* LANGUAGE SELECTOR */

        .language-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .language-selector button {
            padding: 10px 25px;
            font-size: 16px;
            border: 1px solid #777;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .language-selector button.active {
            background: #777;
            border-color: white;
        }

        /* COMIC IMAGE LAYERS */

        .comic-container {
            position: relative;
            width: 100%;
            line-height: 0;
            overflow: hidden;
            border-radius: 8px;
        }

        #comicPage {
            display: block;
            width: 100%;
            height: auto;
        }

        #textOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
        }

        /* NAVIGATION */

        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin: 25px 0 15px;
        }

        .navigation button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            border: 0;
            border-radius: 6px;
        }

        button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        #pageNumber {
            color: #bbb;
        }

        .home {
            display: inline-block;
            margin: 15px 0 30px;
            padding: 12px 28px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        #errorMessage {
            color: #ff9999;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .reader {
                margin: 15px auto;
            }

            .navigation {
                gap: 12px;
            }

            .navigation button {
                padding: 10px 15px;
                font-size: 15px;
            }

        }

    </style>

</head>


<body>

    <main class="reader">

        <h1 id="episodeTitle">Loading episode...</h1>

        <p id="errorMessage"></p>


        <!-- LANGUAGE SELECTOR -->

        <div class="language-selector">

            <button id="srButton">SR</button>

            <button id="enButton" class="active">EN</button>

        </div>


        <!-- GIF + PNG TEXT OVERLAY -->

        <div class="comic-container">

            <img
                id="comicPage"
                alt="Animated comic page"
            >

            <img
                id="textOverlay"
                alt=""
            >

        </div>


        <!-- PAGE NAVIGATION -->

        <div class="navigation">

            <button id="previous">← Previous</button>

            <span id="pageNumber"></span>

            <button id="next">Next →</button>

        </div>


        <a class="home" href="../index.html">⌂ Home</a>

    </main>


    <!-- EPISODE DATABASE -->

    <script src="../data/episodes.js"></script>


    <!-- READER JAVASCRIPT -->

    <script>

        // 1. GET EPISODE ID FROM URL

        const parameters = new URLSearchParams(
            window.location.search
        );

        const episodeID = parameters.get("id");


        // 2. FIND EPISODE

        const episode = window.EPISODES[episodeID];


        // 3. HTML ELEMENTS

        const title = document.getElementById("episodeTitle");

        const comicPage = document.getElementById("comicPage");

        const textOverlay = document.getElementById("textOverlay");

        const pageNumber = document.getElementById("pageNumber");

        const previous = document.getElementById("previous");

        const next = document.getElementById("next");

        const srButton = document.getElementById("srButton");

        const enButton = document.getElementById("enButton");

        const errorMessage = document.getElementById("errorMessage");


        // 4. READER SETTINGS

        let currentPage = 0;

        let currentLanguage = "en";


        // 5. CHECK EPISODE DATA

        if (
            !episode ||
            !episode.pages ||
            !episode.sr ||
            !episode.en ||
            episode.pages.length === 0 ||
            episode.pages.length !== episode.sr.length ||
            episode.pages.length !== episode.en.length
        ) {

            title.textContent = "Episode unavailable";

            errorMessage.textContent =
                "Episode data is missing or incomplete.";

            comicPage.style.display = "none";
            textOverlay.style.display = "none";
            previous.style.display = "none";
            next.style.display = "none";
            pageNumber.style.display = "none";

        } else {


            // 6. CHANGE LANGUAGE

            function updateLanguage() {

                const overlayURL =
                    currentLanguage === "sr"
                        ? episode.sr[currentPage]
                        : episode.en[currentPage];


                // Change ONLY the PNG overlay.
                // GIF animation continues playing.

                textOverlay.src = overlayURL;


                // Update selected language button.

                srButton.classList.toggle(
                    "active",
                    currentLanguage === "sr"
                );

                enButton.classList.toggle(
                    "active",
                    currentLanguage === "en"
                );

                document.documentElement.lang =
                    currentLanguage === "sr" ? "sr" : "en";

            }


            // 7. DISPLAY CURRENT PAGE

          
function showPage() {

    // Sakrij oba sloja dok se nova stranica učitava.
    comicPage.style.visibility = "hidden";
    textOverlay.style.visibility = "hidden";

    let loadedImages = 0;

    function imageReady() {

        loadedImages++;

        // Prikaži GIF i tekst tek kada su oba učitana.
        if (loadedImages === 2) {

            comicPage.style.visibility = "visible";
            textOverlay.style.visibility = "visible";

        }
    }

    // Prati učitavanje oba elementa.
    comicPage.onload = imageReady;
    textOverlay.onload = imageReady;

    // Ako neki fajl ne može da se učita,
    // ne ostavljaj stranicu trajno sakrivenu.
    comicPage.onerror = imageReady;
    textOverlay.onerror = imageReady;

    // Učitaj odgovarajući GIF.
    comicPage.src = episode.pages[currentPage];

    // Učitaj odgovarajući jezički PNG.
    updateLanguage();

    // Broj stranice.
    pageNumber.textContent =
        "Page " + (currentPage + 1) +
        " / " + episode.pages.length;

    // Dugmad za navigaciju.
    previous.disabled = currentPage === 0;

    next.disabled =
        currentPage === episode.pages.length - 1;

    // Povratak na vrh.
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



            // 8. SERBIAN BUTTON

            srButton.addEventListener("click", function() {

                currentLanguage = "sr";

                updateLanguage();

            });


            // 9. ENGLISH BUTTON

            enButton.addEventListener("click", function() {

                currentLanguage = "en";

                updateLanguage();

            });


            // 10. PREVIOUS PAGE

            previous.addEventListener("click", function() {

                if (currentPage > 0) {

                    currentPage--;

                    showPage();

                }

            });


            // 11. NEXT PAGE

            next.addEventListener("click", function() {

                if (currentPage < episode.pages.length - 1) {

                    currentPage++;

                    showPage();

                }

            });


            // 12. INITIAL DISPLAY

            title.textContent = episode.title;

            showPage();

        }

    </script>

</body>

</html>
