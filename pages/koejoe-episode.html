
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KOE JOE | Animated Comic</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .koejoe-reader {
            width: 100%;
            max-width: 720px;
            margin: 25px auto;
        }

        #episodeTitle {
            margin-bottom: 20px;
        }

        #errorMessage {
            color: #ff9999;
            margin: 15px 0;
        }

        /* LANGUAGE SELECTOR */

        .language-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .language-selector button {
            padding: 10px 25px;
            font-size: 16px;
            border: 1px solid #777;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .language-selector button.active {
            background: #777;
            border-color: white;
        }

        /* 9:16 COMIC CONTAINER */

        .comic-container {
            position: relative;
            width: 100%;
            max-width: 720px;
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
        }

        #comicPage,
        #textOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #comicPage {
            object-fit: contain;
        }

        #textOverlay {
            object-fit: fill;
            pointer-events: none;
        }

        /* NAVIGATION */

        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 25px 0 15px;
        }

        .navigation button {
            padding: 12px 25px;
            font-size: 17px;
            cursor: pointer;
            border: 0;
            border-radius: 6px;
        }

        button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        #pageNumber {
            color: #bbb;
        }

        .home {
            display: inline-block;
            margin: 15px 0 30px;
            padding: 12px 28px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        @media (max-width: 600px) {

            body {
                padding: 8px;
            }

            .koejoe-reader {
                margin: 15px auto;
            }

            .navigation {
                gap: 10px;
            }

            .navigation button {
                padding: 10px 14px;
                font-size: 15px;
            }

        }

    </style>

</head>


<body>

<main class="koejoe-reader">

    <h1 id="episodeTitle">Loading episode...</h1>

    <p id="errorMessage"></p>


    <!-- LANGUAGE SELECTOR -->

    <div class="language-selector">

        <button id="srButton">SR</button>

        <button id="enButton" class="active">EN</button>

    </div>


    <!-- GIF + PNG TEXT OVERLAY -->

    <div class="comic-container">

        <img id="comicPage" alt="KOE JOE animated scene">

        <img id="textOverlay" alt="">

    </div>


    <!-- PAGE NAVIGATION -->

    <div class="navigation">

        <button id="previous">← Previous</button>

        <span id="pageNumber"></span>

        <button id="next">Next →</button>

    </div>


    <a class="home" href="koejoe-gallery.html">
        ← KOE JOE Gallery
    </a>

</main>


<!-- KOE JOE DATABASE -->

<script src="../data/koejoe.js"></script>


<!-- KOE JOE READER JAVASCRIPT -->

<script>

    // 1. GET EPISODE ID

    const parameters = new URLSearchParams(
        window.location.search
    );

    const episodeID = parameters.get("id");


    // 2. FIND EPISODE

    const episode = window.KOEJOE_EPISODES?.[episodeID];


    // 3. HTML ELEMENTS

    const title = document.getElementById("episodeTitle");

    const comicPage = document.getElementById("comicPage");

    const textOverlay = document.getElementById("textOverlay");

    const pageNumber = document.getElementById("pageNumber");

    const previous = document.getElementById("previous");

    const next = document.getElementById("next");

    const srButton = document.getElementById("srButton");

    const enButton = document.getElementById("enButton");

    const errorMessage = document.getElementById("errorMessage");


    // 4. READER SETTINGS

    let currentPage = 0;

    let currentLanguage = "en";

    let pageRequest = 0;

    let languageRequest = 0;


    // 5. PRELOAD IMAGE

    function preloadImage(url) {

        return new Promise((resolve, reject) => {

            const image = new Image();

            image.onload = () => resolve(url);

            image.onerror = () => reject(
                new Error("Image loading failed: " + url)
            );

            image.src = url;

            if (image.complete) {

                if (image.naturalWidth > 0) {
                    resolve(url);
                } else {
                    reject(
                        new Error("Image loading failed: " + url)
                    );
                }

            }

        });

    }


    // 6. GET CURRENT LANGUAGE IMAGE

    function getOverlayURL() {

        return currentLanguage === "sr"
            ? episode.sr[currentPage]
            : episode.en[currentPage];

    }


    // 7. UPDATE LANGUAGE BUTTONS

    function updateLanguageButtons() {

        srButton.classList.toggle(
            "active",
            currentLanguage === "sr"
        );

        enButton.classList.toggle(
            "active",
            currentLanguage === "en"
        );

        document.documentElement.lang =
            currentLanguage === "sr" ? "sr" : "en";

    }


    // 8. DISPLAY CURRENT PAGE

    async function showPage() {

        const request = ++pageRequest;

        // Cancel previous language loading request.

        languageRequest++;

        // Hide both layers during loading.

        comicPage.style.visibility = "hidden";

        textOverlay.style.visibility = "hidden";

        errorMessage.textContent = "";


        const gifURL = episode.pages[currentPage];

        const overlayURL = getOverlayURL();


        // Update page counter and navigation.

        pageNumber.textContent =
            "Page " + (currentPage + 1) +
            " / " + episode.pages.length;

        previous.disabled = currentPage === 0;

        next.disabled =
            currentPage === episode.pages.length - 1;


        try {

            // Wait for BOTH images.

            await Promise.all([

                preloadImage(gifURL),

                preloadImage(overlayURL)

            ]);


            // Ignore outdated loading requests.

            if (request !== pageRequest) return;


            // Display matching GIF and PNG.

            comicPage.src = gifURL;

            textOverlay.src = overlayURL;


            comicPage.style.visibility = "visible";

            textOverlay.style.visibility = "visible";


        } catch (error) {

            if (request !== pageRequest) return;

            errorMessage.textContent =
                "Unable to load this page. Please try again.";

        }


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // 9. CHANGE LANGUAGE

    async function changeLanguage(language) {

        if (currentLanguage === language) return;

        currentLanguage = language;

        updateLanguageButtons();


        const request = ++languageRequest;

        const currentPageRequest = pageRequest;

        const overlayURL = getOverlayURL();


        // Hide only text layer.
        // GIF continues playing.

        textOverlay.style.visibility = "hidden";


        try {

            await preloadImage(overlayURL);


            if (
                request !== languageRequest ||
                currentPageRequest !== pageRequest
            ) return;


            textOverlay.src = overlayURL;

            textOverlay.style.visibility = "visible";


        } catch (error) {

            if (
                request !== languageRequest ||
                currentPageRequest !== pageRequest
            ) return;

            errorMessage.textContent =
                "Unable to load subtitles.";

        }

    }


    // 10. SERBIAN BUTTON

    srButton.addEventListener("click", function() {

        changeLanguage("sr");

    });


    // 11. ENGLISH BUTTON

    enButton.addEventListener("click", function() {

        changeLanguage("en");

    });


    // 12. PREVIOUS PAGE

    previous.addEventListener("click", function() {

        if (currentPage > 0) {

            currentPage--;

            showPage();

        }

    });


    // 13. NEXT PAGE

    next.addEventListener("click", function() {

        if (currentPage < episode.pages.length - 1) {

            currentPage++;

            showPage();

        }

    });


    // 14. CHECK EPISODE DATA

    if (

        !episode ||

        !Array.isArray(episode.pages) ||

        !Array.isArray(episode.sr) ||

        !Array.isArray(episode.en) ||

        episode.pages.length === 0 ||

        episode.pages.length !== episode.sr.length ||

        episode.pages.length !== episode.en.length

    ) {

        title.textContent = "Episode unavailable";

        errorMessage.textContent =
            "Episode data is missing or incomplete.";

        comicPage.style.display = "none";

        textOverlay.style.display = "none";

        previous.style.display = "none";

        next.style.display = "none";

        pageNumber.style.display = "none";

        document.querySelector(".language-selector").style.display = "none";

    } else {


        // INITIAL DISPLAY

        title.textContent = episode.title;

        updateLanguageButtons();

        showPage();

    }

</script>

</body>
</html>
