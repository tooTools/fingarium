
<!DOCTYPE html>

    <style>
        .koejoe-gallery {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .koejoe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 260px));
            justify-content: center;
            gap: 25px;
            margin-top: 35px;
        }

        .koejoe-card {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            background: rgba(128,128,128,0.15);
            transition: transform 0.2s;
        }

        .koejoe-card:hover {
            transform: translateY(-5px);
        }

        .koejoe-card video {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: contain;
            background: #111;
            border-radius: 8px;
        }

        .koejoe-back {
            display: inline-block;
            margin-top: 35px;
            color: white;
        }
    </style>
</head>

<div class="page-wrapper">

    <header>

        <p>Animated Stories and Adventures</p>

        <div class="koejoe-grid">

            <!-- EPISODE 01 -->

            <a class="koejoe-card"

                <video
                    autoplay
                    muted
                    loop
                    playsinline
                    preload="metadata"
                >
                    <source
                        src="https://fingarium.damircekicdamir.workers.dev/WebMedia/KOE%20JOE/Gif/Ep-1/koejoe-ep001-p001.mp4"
