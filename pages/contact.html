                                             <!-- GoogleSheetForm  -->  <center>
                                             
                                                <div class="contact">
                                                    <h1 class="contact-title">Contact Us</h1>
                                                   <!-- <p class="contact-description">Description Text Goes Here.</p> -->
                                    
                                    
                                                    
                                                    <form action="" name="contact-us">
                                                        <div class="form-group">
                                                            <label for="email">Email</label>
                                                            <input type="email" name="email" id="email" class="inputField">
                                                        </div>
                                                        <div class="form-group">
                                                            <label for="name">Name</label>
                                                            <input type="text" name="name" id="name" class="inputField">
                                                        </div>
                                                        <div class="form-group">
                                                            <label for="message">Message</label>
                                                            <textarea name="message" id="message" cols="30" rows="5" class="inputField"></textarea>
                                                        </div>
                                                        <button type="submit" class="btn-submit">Submit</button>
                                                    </form>
                                                  
                                                </div>
                                            </center> 
                                                           <!--(Btn) <li> <a href="pages/episodes.html">Send</a> </li>-->
                                                           <script>
                                                            const scriptURL = 'https://script.google.com/macros/s/AKfycbyRdl0fx2do1xjg-aQE4K4E7PBpLwlfv6kgkMvD_8vo5yaDZRmev9k4gLgU2WXN-4a1/exec'
                                                            const form = document.forms['contact-us']
                                                          
                                                            form.addEventListener('submit', e => {
                                                              e.preventDefault()
                                                              fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                                                                .then(response => {
                                                                    form.reset ()
                                                                    alert ('Success!')
                                                                })
                                                                .catch(error => console.error('Error!', error.message))
                                                            })
                                                          </script>
