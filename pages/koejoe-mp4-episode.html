
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KOE JOE | Read Episode</title>

    <link rel="stylesheet" href="../styles/style.css">

    <style>
        .reader {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            padding: 10px;
            text-align: center;
            color: white;
        }

        .comic-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: 20px auto;
            aspect-ratio: 9 / 16;
            background: #111;
            overflow: hidden;
        }

        #comicVideo,
        #textOverlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #comicVideo {
            z-index: 1;
        }

        #textOverlay {
            z-index: 2;
            pointer-events: none;
        }

        .reader-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        .reader-controls button {
            cursor: pointer;
            padding: 10px 18px;
        }

        #pageNumber {
            min-width: 80px;
        }
    </style>
</head>

<body>

<div class="page-wrapper">

    <header>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="koejoe-mp4-gallery.html">KOE JOE Gallery</a></li>
        </ul>
    </header>

    <main class="reader">

        <h1>KOE JOE</h1>

        <div class="reader-controls">

            <button id="srButton" type="button">SR</button>
            <button id="enButton" type="button">EN</button>

        </div>

        <div class="comic-container">

            <video
                id="comicVideo"
                autoplay
                muted
                loop
                playsinline
                preload="auto"
            ></video>

            <img
                id="textOverlay"
                src=""
                alt="Comic text"
            >

        </div>

        <div class="reader-controls">

            <button id="prevButton" type="button">← Previous</button>

            <span id="pageNumber">1 / 4</span>

            <button id="nextButton" type="button">Next →</button>

        </div>

        <a href="koejoe-mp4-gallery.html">← Back to Gallery</a>

    </main>

</div>

<script src="../data/koejoe-mp4-episodes.js"></script>

<script>
(function () {

    const params = new URLSearchParams(window.location.search);
    const episodeId = params.get("id");

    const episode = window.KOEJOE_MP4_EPISODES[episodeId];

    if (!episode) {
        document.querySelector(".reader").innerHTML =
            "<h1>Episode not found</h1><a href='koejoe-mp4-gallery.html'>Back to Gallery</a>";
        return;
    }

    const video = document.getElementById("comicVideo");
    const overlay = document.getElementById("textOverlay");

    const pageNumber = document.getElementById("pageNumber");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");

    let currentPage = 0;
    let currentLanguage = "sr";

    function updateOverlay() {
        overlay.src = episode[currentLanguage][currentPage];
    }

    function updatePage() {

        video.src = episode.pages[currentPage];

        video.load();

        const playPromise = video.play();

        if (playPromise !== undefined) {
            playPromise.catch(function () {});
        }

        updateOverlay();

        pageNumber.textContent =
            (currentPage + 1) + " / " + episode.pages.length;

        prevButton.disabled = currentPage === 0;
        nextButton.disabled = currentPage === episode.pages.length - 1;
    }

    document.getElementById("srButton").addEventListener("click", function () {
        currentLanguage = "sr";
        updateOverlay();
    });

    document.getElementById("enButton").addEventListener("click", function () {
        currentLanguage = "en";
        updateOverlay();
    });

    prevButton.addEventListener("click", function () {
        if (currentPage > 0) {
            currentPage--;
            updatePage();
        }
    });

    nextButton.addEventListener("click", function () {
        if (currentPage < episode.pages.length - 1) {
            currentPage++;
            updatePage();
        }
    });

    updatePage();

})();
</script>

</body>
</html>
