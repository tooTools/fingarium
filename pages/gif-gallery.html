
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Comics | Fingarium</title>
    <link rel="stylesheet" href="../styles/style.css">

    <style>
        .comics-gallery {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-top: 35px;
        }

        .episode-card {
            display: block;
            color: inherit;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            background: rgba(128,128,128,0.10);
            transition: transform 0.2s;
        }

        .episode-card:hover {
            transform: translateY(-5px);
        }

        .episode-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .back-home {
            display: inline-block;
            margin-top: 35px;
        }
    </style>
</head>

<body>
<div class="page-wrapper">

    <header>
        <ul>
            <li><a href="../index.html">Home</a></li>
        </ul>
    </header>

    <main class="comics-gallery">

        <h1>ANIMATED COMICS</h1>
        <p>Stories, episodes and animated adventures.</p>

        <h2>3R Protocol</h2>

        <div class="episode-grid">

            <a class="episode-card"
               href="https://ik.imagekit.io/fingarium/Giff/Giff/3R%20Protocol/test%20dimenzija%205.gif">

                <img
                    src="https://ik.imagekit.io/fingarium/Giff/Giff/3R%20Protocol/test%20dimenzija%205.gif"
                    alt="3R Protocol Episode 01">

                <h2>Episode 01</h2>
                <p>3R Protocol – Animated Comic</p>
                <span>Read episode →</span>

            </a>

        </div>

        <a class="back-home" href="../index.html">
            ← Back to Home
        </a>

    </main>

</div>
</body>
</html>
