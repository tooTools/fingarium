
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Gallery | Fingarium</title>
    <link rel="stylesheet" href="../styles/style.css">

    <style>
        .gallery-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 35px;
        }

        .gallery-item {
            padding: 15px;
            border-radius: 12px;
            background: rgba(128,128,128,0.08);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .back-link {
            display: inline-block;
            margin: 20px;
        }
    </style>
</head>

<body>

<div class="page-wrapper">

    <header>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../pages/quiz-select.html">Quiz</a></li>
            <li><a href="../pages/pageGamesCommingSoon.html">Games</a></li>
            <li><a href="../pages/contact.html">Contact</a></li>
        </ul>
    </header>

    <main class="gallery-container">

        <h1>GIF Gallery</h1>
        <p>Animated visuals and creative experiments.</p>

        <div class="gallery-grid">

            <div class="gallery-item">
                <img
                    src="https://ik.imagekit.io/fingarium/Giff/Giff/3R%20Protocol/TestIzAftera.gif"
                    alt="3R Protocol GIF"
                    loading="lazy"
                >
                <h2>3R Protocol</h2>
            </div>

        </div>

        <a class="back-link" href="../index.html">← Back to Home</a>

    </main>

</div>

</body>
</html>
